# ===== 构建环境 =====
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8

# ===== 代理端插件 =====
# 适配 Velocity 3.4.x（对应 Minecraft 1.21.x 代理协议，支持 1.21.11 客户端）
# 若你的 Velocity 是 3.3.x / 3.5.x，把版本号改成对应值即可，源码无需修改
velocity_version=3.4.0-SNAPSHOT
adventure_version=4.17.0

# ===== Fabric 服务端模组（可选组件）=====
# 与 Minecraft 1.21.11 / Fabric Loader 对应
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.10
fabric_api_version=0.135.1+1.21.11
loom_version=1.12-SNAPSHOT
mod_version=1.0.0
maven_group=com.qqlink
archives_base_name=qqlink-fabric
